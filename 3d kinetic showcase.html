<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AETHER // Kinetic Core Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@200;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #040508;
      --amber: #ffaa44;
      --emerald: #00e5a3;
      --sapphire: #3a86ff;
      --current-accent: var(--amber);
      --text: #f0f2f8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
    }

    /* Fullscreen WebGL & Canvas Stage */
    #worldCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating UI Navigation Overlay */
    .ui-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 64px;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .brand-mark {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-weight: 700;
      color: #ffffff;
    }

    .status-badge {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--current-accent);
      box-shadow: 0 0 12px var(--current-accent);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    /* Hero Editorial Copy (Floating Bottom Left) */
    .hero-editorial {
      pointer-events: auto;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .editorial-tag {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--current-accent);
      font-weight: 600;
      transition: color 0.4s ease;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.2rem;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.6;
      font-weight: 200;
    }

    /* Custom Material Swatches Floating Right */
    .material-palette {
      position: absolute;
      right: 64px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .palette-label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      margin-bottom: 10px;
    }

    .swatch-node {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .swatch-node.active {
      transform: scale(1.4);
      border-color: #ffffff;
    }

    .swatch-amber { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
    .swatch-emerald { background: var(--emerald); box-shadow: 0 0 12px var(--emerald); }
    .swatch-sapphire { background: var(--sapphire); box-shadow: 0 0 12px var(--sapphire); }

    /* Interactive Bottom Bar Controls */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
    }

    .hint-text {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    .cta-button {
      padding: 16px 40px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      color: #ffffff;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.35s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .cta-button:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Fullscreen Interactive Canvas -->
  <canvas id="worldCanvas"></canvas>

  <!-- UI Overlay Layer -->
  <div class="ui-overlay">
    <div class="top-nav">
      <div class="brand-mark">KINETIC // 01</div>
      <div class="status-badge">
        <div class="pulse-indicator" id="pulseDot"></div>
        SPATIAL ASSEMBLY STAGE
      </div>
    </div>

    <!-- Right Side Palette Picker -->
    <div class="material-palette">
      <span class="palette-label">MATERIAL MATRIX</span>
      <div class="swatch-node swatch-amber active" data-color="#ffaa44" data-name="AMBER TITANIUM"></div>
      <div class="swatch-node swatch-emerald" data-color="#00e5a3" data-name="EMERALD CERAMIC"></div>
      <div class="swatch-node swatch-sapphire" data-color="#3a86ff" data-name="SAPPHIRE GLASS"></div>
    </div>

    <div class="hero-editorial">
      <div class="editorial-tag" id="materialName">AMBER TITANIUM // LIMITED 100</div>
      <h1>MONOLITH X</h1>
      <p>Precision-milled acoustic resonator floating in zero-friction magnetic alignment. Drag to tilt the stage or click to explode internal assembly layers.</p>
    </div>

    <div class="bottom-bar">
      <div class="hint-text">[ Click Product Core to Toggle Exploded View ]</div>
      <button class="cta-button">Acquire Edition</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    const pulseDot = document.getElementById('pulseDot');
    const materialName = document.getElementById('materialName');
    const swatches = document.querySelectorAll('.swatch-node');

    let currentAccentHex = '#ffaa44';
    let isExploded = false;
    let explosionOffset = 0;
    let targetExplosion = 0;

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let targetMouseX = mouseX;
    let targetMouseY = mouseY;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('mousemove', (e) => {
      targetMouseX = e.clientX;
      targetMouseY = e.clientY;
    });

    // Toggle Exploded View on Canvas Click
    canvas.addEventListener('click', (e) => {
      const distFromCenter = Math.hypot(e.clientX - canvas.width / 2, e.clientY - canvas.height / 2);
      if (distFromCenter < 180) {
        isExploded = !isExploded;
        targetExplosion = isExploded ? 45 : 0;
      }
    });

    // --- Material Swatch Selection ---
    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');

        currentAccentHex = swatch.getAttribute('data-color');
        materialName.innerText = `${swatch.getAttribute('data-name')} // LIMITED 100`;

        document.documentElement.style.setProperty('--current-accent', currentAccentHex);
      });
    });

    // --- Main Render Loop ---
    let time = 0;

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Smooth Lerp Mouse Tracking
      mouseX += (targetMouseX - mouseX) * 0.05;
      mouseY += (targetMouseY - mouseY) * 0.05;

      // Smooth Lerp Explosion Physics
      explosionOffset += (targetExplosion - explosionOffset) * 0.08;

      time += 0.015;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 1. Draw Gravitational Grid Floor
      ctx.lineWidth = 1;
      const gridSpacing = 50;
      const horizonY = centerY + 120;

      for (let x = -canvas.width; x < canvas.width * 2; x += gridSpacing) {
        ctx.beginPath();
        for (let y = horizonY; y < canvas.height; y += 15) {
          const distToMouse = Math.hypot(x - mouseX, y - mouseY);
          const warp = Math.max(0, (250 - distToMouse) / 250) * 35;

          const projectedX = centerX + (x - centerX) * ((y - horizonY + 100) / 300);
          const warpOffsetX = (x - mouseX) / (distToMouse || 1) * warp;

          if (y === horizonY) ctx.moveTo(projectedX + warpOffsetX, y);
          else ctx.lineTo(projectedX + warpOffsetX, y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.stroke();
      }

      // 2. Draw Floating Product Pedestal Ambient Glow
      const glowGrad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 220);
      glowGrad.addColorStop(0, currentAccentHex + '33');
      glowGrad.addColorStop(0.6, currentAccentHex + '08');
      glowGrad.addColorStop(1, 'transparent');

      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 220, 0, Math.PI * 2);
      ctx.fill();

      // 3. Draw Kinetic Product Rings (Exploded Spatial Assembly)
      const ringCount = 5;
      const tiltAngle = (mouseY - centerY) * 0.0005;
      const rotateAngle = (mouseX - centerX) * 0.001 + time * 0.2;

      ctx.save();
      ctx.translate(centerX, centerY);

      for (let i = 0; i < ringCount; i++) {
        const ringRadius = 110 - i * 16;
        const currentYOffset = (i - (ringCount - 1) / 2) * explosionOffset;

        ctx.save();
        ctx.translate(0, currentYOffset + Math.sin(time + i) * 6);
        ctx.rotate(tiltAngle);

        ctx.beginPath();
        ctx.ellipse(0, 0, ringRadius, ringRadius * 0.45, rotateAngle + i * 0.3, 0, Math.PI * 2);

        // Metallic / Glass Dynamic Stroke Gradient
        const grad = ctx.createLinearGradient(-ringRadius, -ringRadius, ringRadius, ringRadius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, currentAccentHex);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = 3.5 - i * 0.5;
        ctx.shadowBlur = 18;
        ctx.shadowColor = currentAccentHex;
        ctx.stroke();

        ctx.restore();
      }

      // Central Quantum Core Element
      ctx.beginPath();
      ctx.arc(0, Math.sin(time) * 4, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 25;
      ctx.shadowColor = currentAccentHex;
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
