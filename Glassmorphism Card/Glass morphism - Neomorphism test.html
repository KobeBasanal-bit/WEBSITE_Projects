<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aesthetic Product Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* --- Core Reset & Global Styles --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #08090d;
      color: #ffffff;
      overflow: hidden;
      perspective: 1000px;
    }

    /* --- Ambient Glow Background Orbs --- */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.45;
      pointer-events: none;
      animation: float 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #7928ca, #ff0080);
      top: -10%;
      left: 15%;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #0070f3, #00dfd8);
      bottom: -10%;
      right: 15%;
      animation-delay: -7s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.15); }
    }

    /* --- Interactive Product Card Container --- */
    .card-container {
      position: relative;
      width: 380px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      cursor: pointer;
    }

    /* --- Cursor Spotlight Layer --- */
    .spotlight {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: radial-gradient(
        600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.08),
        transparent 40%
      );
      pointer-events: none;
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transform: translateZ(30px); /* 3D effect offset */
    }

    /* --- Badge --- */
    .badge-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #00dfd8;
    }

    .series {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
    }

    /* --- Product Visual Frame --- */
    .product-stage {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .glow-ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-color, #00dfd8) 0%, transparent 70%);
      opacity: 0.35;
      filter: blur(30px);
      transition: background 0.5s ease;
    }

    /* Stylized SVG Product Art */
    .product-svg {
      width: 160px;
      height: 160px;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
      transform: translateZ(50px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-container:hover .product-svg {
      transform: translateZ(70px) scale(1.06) rotate(-3deg);
    }

    /* --- Product Details --- */
    .product-info h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .product-info p {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* --- Color Selector Controls --- */
    .color-picker {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
    }

    .options {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .dot.active {
      border-color: #ffffff;
      transform: scale(1.2);
    }

    .dot-cyan { background-color: #00dfd8; }
    .dot-purple { background-color: #7928ca; }
    .dot-gold { background-color: #ffb703; }

    /* --- Card Footer & CTA Button --- */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price-tag {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.05em;
    }

    .price {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .cta-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 14px;
      background: #ffffff;
      color: #08090d;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.15);
    }

    .cta-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 15px 30px rgba(255, 255, 255, 0.25);
      background: #00dfd8;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Backgrounds -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <!-- Interactive 3D Product Card -->
  <div class="card-container" id="card">
    <div class="spotlight" id="spotlight"></div>
    
    <div class="card-content">
      <div class="badge-wrap">
        <span class="badge">Next-Gen</span>
        <span class="series">AERO-X // 01</span>
      </div>

      <!-- Interactive Stage -->
      <div class="product-stage">
        <div class="glow-ring" id="glowRing"></div>
        
        <!-- Vector Graphic (Aesthetic Futuristic Core) -->
        <svg class="product-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="70" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
          <circle cx="100" cy="100" r="50" stroke="url(#grad)" stroke-width="8"/>
          <path d="M70 100 L130 100 M100 70 L100 130" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="16" fill="url(#coreGrad)"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00dfd8" id="stop1"/>
              <stop offset="100%" stop-color="#7928ca" id="stop2"/>
            </linearGradient>
            <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#00dfd8" id="coreStop"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <div class="product-info">
        <h2>Aero Pulse Core</h2>
        <p>Spatial acoustic driver featuring real-time neural noise isolation and tactile feedback.</p>
      </div>

      <!-- Interactive Swatches -->
      <div class="color-picker">
        <span class="color-label">Finish:</span>
        <div class="options">
          <div class="dot dot-cyan active" data-color="#00dfd8" data-gradient="#7928ca"></div>
          <div class="dot dot-purple" data-color="#7928ca" data-gradient="#ff0080"></div>
          <div class="dot dot-gold" data-color="#ffb703" data-gradient="#ff0055"></div>
        </div>
      </div>

      <div class="card-footer">
        <div class="price-tag">
          <span class="price-label">Price</span>
          <span class="price">$299</span>
        </div>
        <button class="cta-btn">Experience</button>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const spotlight = document.getElementById('spotlight');
    const glowRing = document.getElementById('glowRing');
    const colorDots = document.querySelectorAll('.dot');
    const stop1 = document.getElementById('stop1');
    const stop2 = document.getElementById('stop2');
    const coreStop = document.getElementById('coreStop');

    // 1. Dynamic 3D Tilt Effect & Cursor Tracking Spotlight
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Update cursor position CSS variables
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);

      // Calculate tilt angles relative to card center
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -12; // max tilt deg
      const rotateY = ((x - centerX) / centerX) * 12;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    // Reset card tilt when cursor leaves
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    // 2. Interactive Color Switcher & SVG Gradient Update
    colorDots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        // Active dot class toggle
        colorDots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');

        const primaryColor = dot.getAttribute('data-color');
        const secondaryColor = dot.getAttribute('data-gradient');

        // Update glow and SVG gradients dynamically
        glowRing.style.setProperty('--accent-color', primaryColor);
        stop1.setAttribute('stop-color', primaryColor);
        stop2.setAttribute('stop-color', secondaryColor);
        coreStop.setAttribute('stop-color', primaryColor);
      });
    });
  </script>
</body>
</html>
